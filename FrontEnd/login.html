<!DOCTYPE html>
<html lang="pt-br">
<!-- ===================== -->
<!-- Metadados e recursos da página -->
<!-- ===================== -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Controle Patrimonial</title>
    <link rel="icon" href="/Imagens/favicon.svg">
    <link rel="stylesheet" href="css/style_login.css">
</head>
<!-- ===================== -->
<!-- Conteúdo da página -->
<!-- ===================== -->

<body>
    <main class="login-card">
        <img src="/Imagens/logo.svg" alt="Touch Inventory" class="logo-grupo">

        <section id="areaLogin" class="oculto">
            <p class="rotulo">Touch Inventory</p>
            <h1>Entrar no sistema</h1>
            <p class="descricao">
                Entre com sua conta pessoal. Você escolherá a unidade em seguida.
            </p>

            <form id="formLogin">
                <label for="login">Usuário</label>
                <input
                    id="login"
                    name="login"
                    type="text"
                    autocomplete="username"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    id="senha"
                    name="senha"
                    type="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">Entrar</button>
            </form>
        </section>

        <section id="areaConfiguracao" class="oculto">
            <p class="rotulo">Primeiro acesso</p>
            <h1>Crie o administrador</h1>
            <p class="descricao">Comece com uma conta. Depois, cadastre os setores e os demais usuários na tela de gestão.</p>
            <form id="formConfiguracao">
                <label for="nomeAdmin">Nome</label>
                <input id="nomeAdmin" maxlength="100" autocomplete="name" required>
                <label for="loginAdmin">Usuário</label>
                <input id="loginAdmin" minlength="3" maxlength="60" autocomplete="username" required>
                <label for="senhaAdmin">Senha</label>
                <input id="senhaAdmin" type="password" minlength="8" autocomplete="new-password" required>
                <button type="submit">Criar administrador e entrar</button>
            </form>        </section>

        <p id="mensagemLogin" class="mensagem oculto" role="alert"></p>
    </main>

    <script src="js/login.js"></script>
<script src="/js/rodape.js" defer></script>
</body>
</html>
