<!DOCTYPE html>
<html lang="pt-br">
<!-- ===================== -->
<!-- Metadados e recursos da página -->
<!-- ===================== -->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detalhe do Ativo</title>
  <link rel="icon" href="/Imagens/favicon.svg">
  <link rel="stylesheet" href="css/style_ativo.css">
</head>

<!-- ===================== -->
<!-- Conteúdo da página -->
<!-- ===================== -->

<body>

<div class="card">

    <img src="/Imagens/logo.svg"
         alt="Touch Inventory"
         class="logo">

    <h1>Detalhe do Ativo</h1>

    <div id="conteudo" class="loading">
        Carregando dados do ativo...
    </div>

<div class="botoes">
    <button class="botao" onclick="voltarPagina()">
        Voltar
    </button>
</div>

<!-- ===================== -->
<!-- Scripts da página -->
<!-- ===================== -->

<script>
async function voltarPagina() {
    const destino = "/index.html";
    const response = await fetch("/api/auth/me");
    window.location.href = response.ok
        ? destino
        : `/login.html?retorno=${encodeURIComponent(destino)}`;
}
</script>

</div>
<script src="js/auth.js"></script>
<script src="js/ativo.js"></script>

<script src="/js/rodape.js" defer></script>
</body>
</html>
